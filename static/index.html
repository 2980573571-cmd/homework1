<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Explanation Agent</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #e6e8eb;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --user-bubble: #4f46e5;
    --user-text: #ffffff;
    --code-bg: #0f172a;
    --code-text: #e2e8f0;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  /* 顶栏 */
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header .logo { font-size: 26px; }
  header .title { font-size: 17px; font-weight: 700; }
  header .subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }
  header .spacer { flex: 1; }
  .badge {
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid #dfe3ff;
    border-radius: 999px;
    padding: 4px 12px;
    white-space: nowrap;
    max-width: 340px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badge.error { color: var(--danger); background: var(--danger-soft); border-color: #fecaca; }
  .btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--bg); border-color: #cbd0d6; }

  /* 消息区 */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .thread { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 18px; }

  .welcome {
    text-align: center;
    margin: 40px 0 12px;
    color: var(--muted);
  }
  .welcome h2 { color: var(--text); margin: 0 0 8px; font-size: 20px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .example {
    font-size: 13px;
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    color: var(--text);
    transition: border-color .15s, background .15s;
  }
  .example:hover { border-color: var(--accent); background: var(--accent-soft); }

  .msg { display: flex; gap: 10px; max-width: 100%; }
  .msg .avatar {
    width: 34px; height: 34px; border-radius: 10px;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 18px; background: var(--bg); border: 1px solid var(--border);
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: var(--user-bubble); border-color: var(--user-bubble); }
  .bubble {
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.65;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    max-width: 78%;
  }
  .msg.user .bubble { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.assistant .bubble.error { border-color: #fecaca; background: var(--danger-soft); }

  /* 工具使用指示 */
  .tools {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
    font-size: 12px; color: var(--muted);
  }
  .tool-chip {
    border: 1px solid #e5e7eb; background: #f9fafb; border-radius: 6px;
    padding: 2px 8px; display: inline-flex; align-items: center; gap: 4px;
  }
  .typing { color: var(--muted); font-size: 13px; display: inline-flex; gap: 3px; }
  .typing span { animation: blink 1.2s infinite both; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity:.25; } 40% { opacity:1; } }

  /* Markdown 元素 */
  .bubble pre {
    background: var(--code-bg); color: var(--code-text);
    padding: 12px 14px; border-radius: 8px; overflow-x: auto;
    font-family: "JetBrains Mono", Consolas, "Courier New", monospace;
    font-size: 13px; line-height: 1.5;
  }
  .bubble code {
    font-family: "JetBrains Mono", Consolas, "Courier New", monospace;
    font-size: 13px; background: rgba(0,0,0,.05); padding: 1px 5px; border-radius: 4px;
  }
  .bubble pre code { background: none; padding: 0; color: var(--code-text); }
  .bubble h3, .bubble h4 { margin: 12px 0 6px; }
  .bubble ul { margin: 6px 0; padding-left: 22px; }
  .bubble p { margin: 0 0 8px; }

  /* 输入区 */
  footer {
    flex-shrink: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    justify-content: center;
  }
  .input-wrap {
    width: 100%; max-width: 820px; display: flex; gap: 10px; align-items: flex-end;
  }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; font-size: 15px; font-family: inherit; line-height: 1.5;
    max-height: 160px; outline: none; color: var(--text); background: var(--bg);
  }
  textarea:focus { border-color: var(--accent); background: #fff; }
  #send {
    border: none; background: var(--accent); color: #fff; border-radius: 12px;
    padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer;
    flex-shrink: 0; transition: opacity .15s;
  }
  #send:hover { opacity: .9; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  .attach {
    border: 1px solid var(--border); background: var(--panel); border-radius: 12px;
    padding: 12px 14px; font-size: 16px; cursor: pointer; flex-shrink: 0;
    transition: background .15s, border-color .15s;
  }
  .attach:hover { background: var(--bg); border-color: #cbd0d6; }
  .file-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .file-chips:empty { display: none; }
  .file-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; border: 1px solid #dfe3ff; background: var(--accent-soft);
    color: var(--accent); border-radius: 999px; padding: 3px 6px 3px 10px;
    max-width: 280px;
  }
  .file-chip .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-chip .fdel {
    cursor: pointer; border: none; background: none; color: var(--accent);
    font-size: 14px; line-height: 1; padding: 0 4px;
  }
  .file-chip .fdel:hover { color: var(--danger); }
  .hint { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0 0; }
</style>
</head>
<body>
  <header>
    <span class="logo">🤖</span>
    <div>
      <div class="title">Code Explanation Agent</div>
      <div class="subtitle">解释代码逻辑 · 生成注释 · 代码问答</div>
    </div>
    <span class="spacer"></span>
    <span class="badge" id="model-badge">加载中…</span>
    <button class="btn" id="clear-btn" title="清空对话历史">🗑️ 清空对话</button>
  </header>

  <main>
    <div class="thread" id="thread"></div>
  </main>

  <footer>
    <div style="width:100%;max-width:820px;">
      <div class="file-chips" id="file-chips"></div>
      <div class="input-wrap">
        <button class="attach" id="attach-btn" title="导入本地文件">📎</button>
        <textarea id="input" rows="1" placeholder="输入代码相关问题，或点击 📎 导入本地文件…"></textarea>
        <button id="send" title="发送 (Enter)">发送</button>
      </div>
      <div class="hint">Enter 发送 · Shift+Enter 换行 · 📎 导入本地文件</div>
    </div>
  </footer>
  <input type="file" id="file-input" multiple hidden>

<script>
(() => {
  const thread = document.getElementById('thread');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const clearBtn = document.getElementById('clear-btn');
  const modelBadge = document.getElementById('model-badge');
  const attachBtn = document.getElementById('attach-btn');
  const fileInput = document.getElementById('file-input');
  const fileChips = document.getElementById('file-chips');
  const attachedFiles = [];   // { name, content, truncated }
  const MAX_FILE_CHARS = 12000;

  const EXAMPLES = [
    "解释 examples/sample_code.py 的逻辑",
    "为这段代码生成中文注释:\n\ndef add(a, b):\n    return a + b",
    "average_age 函数的时间复杂度是多少？",
    "搜索 add_user 方法在哪里被调用",
    "解释 agent/tools.py 的设计思路",
  ];

  // ---------------- 配置加载 ----------------
  async function loadConfig() {
    try {
      const r = await fetch('/api/config');
      const cfg = await r.json();
      modelBadge.textContent = `模型：${cfg.model}`;
      modelBadge.classList.remove('error');
      if (!cfg.ready) {
        modelBadge.textContent = '⚠️ 未配置或配置无效';
        modelBadge.classList.add('error');
      }
    } catch (e) {
      modelBadge.textContent = '⚠️ 无法连接服务';
      modelBadge.classList.add('error');
    }
  }

  // ---------------- 渲染辅助 ----------------
  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderMarkdown(text) {
    // 先抽出围栏代码块，避免内部内容被转义/误解析
    const blocks = [];
    let src = text.replace(/```([\w+-]*)[ \t]*\n?([\s\S]*?)```/g, (m, lang, code) => {
      blocks.push({ lang: lang || '', code: code.replace(/\n$/, '') });
      return '\n@@CODEBLOCK' + (blocks.length - 1) + '@@\n';
    });
    src = escapeHtml(src);
    blocks.forEach((b, i) => {
      const langTag = b.lang ? `<span class="code-lang">${escapeHtml(b.lang)}</span>` : '';
      const html = `<pre>${langTag}<code>${escapeHtml(b.code)}</code></pre>`;
      src = src.split('@@CODEBLOCK' + i + '@@').join(html);
    });
    // 行内代码
    src = src.replace(/`([^`]+)`/g, '<code>$1</code>');
    // 加粗
    src = src.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    // 标题
    src = src.replace(/^###\s+(.*)$/gm, '<h4>$1</h4>');
    src = src.replace(/^##\s+(.*)$/gm, '<h4>$1</h4>');
    src = src.replace(/^#\s+(.*)$/gm, '<h3>$1</h3>');
    // 无序列表
    src = src.replace(/^[-*]\s+(.*)$/gm, '<li>$1</li>');

    const lines = src.split('\n');
    let out = '', inList = false;
    for (const line of lines) {
      const t = line.trim();
      if (t.startsWith('<li>')) {
        if (!inList) { out += '<ul>'; inList = true; }
        out += line;
      } else {
        if (inList) { out += '</ul>'; inList = false; }
        if (t === '') { out += ''; }
        else if (t.startsWith('<h') || t.startsWith('<pre') || t.startsWith('<ul')) { out += line; }
        else { out += '<p>' + line + '</p>'; }
      }
    }
    if (inList) out += '</ul>';
    return out;
  }

  function addWelcome() {
    thread.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'welcome';
    div.innerHTML =
      '<h2>👋 有什么代码问题想问我？</h2>' +
      '<div>我可以解释代码逻辑、生成中文注释、回答代码问题，并调用工具读取与搜索代码。</div>';
    const ex = document.createElement('div');
    ex.className = 'examples';
    EXAMPLES.forEach(p => {
      const chip = document.createElement('button');
      chip.className = 'example';
      chip.textContent = p.replace(/\n/g, ' ').slice(0, 32);
      chip.addEventListener('click', () => { input.value = p; autoResize(); input.focus(); });
      ex.appendChild(chip);
    });
    div.appendChild(ex);
    thread.appendChild(div);
  }

  function appendMsg(role, content, opts = {}) {
    document.querySelector('.welcome')?.remove();
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '🧑' : '🤖';
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (opts.error ? ' error' : '');
    if (opts.html) bubble.innerHTML = content;
    else bubble.textContent = content;
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    thread.appendChild(wrap);
    scrollToBottom();
    return bubble;
  }

  function addToolRow(tools) {
    const wrap = document.createElement('div');
    wrap.className = 'tools';
    wrap.id = 'tool-row';
    tools.forEach(t => {
      const chip = document.createElement('span');
      chip.className = 'tool-chip';
      chip.textContent = '🔧 ' + t;
      wrap.appendChild(chip);
    });
    thread.appendChild(wrap);
    scrollToBottom();
  }

  function scrollToBottom() {
    const main = document.querySelector('main');
    main.scrollTop = main.scrollHeight;
  }

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }

  // ---------------- 本地文件导入 ----------------
  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('读取失败'));
      reader.readAsText(file);
    });
  }

  function renderFileChips() {
    fileChips.innerHTML = '';
    attachedFiles.forEach((f, i) => {
      const chip = document.createElement('span');
      chip.className = 'file-chip';
      const name = document.createElement('span');
      name.className = 'fname';
      name.textContent = '📄 ' + f.name + (f.truncated ? '（已截断）' : '');
      name.title = f.name;
      const del = document.createElement('button');
      del.className = 'fdel';
      del.textContent = '×';
      del.title = '移除';
      del.addEventListener('click', () => { attachedFiles.splice(i, 1); renderFileChips(); });
      chip.appendChild(name);
      chip.appendChild(del);
      fileChips.appendChild(chip);
    });
  }

  async function handleFiles(list) {
    for (const f of Array.from(list || [])) {
      if (f.size > 5 * 1024 * 1024) { alert('文件过大（>5MB），已跳过：' + f.name); continue; }
      let text;
      try { text = await readFileAsText(f); }
      catch (e) { alert('读取失败：' + f.name); continue; }
      if (/\0/.test(text.slice(0, 1000))) { alert('无法识别为文本文件，已跳过：' + f.name); continue; }
      const truncated = text.length > MAX_FILE_CHARS;
      if (truncated) text = text.slice(0, MAX_FILE_CHARS);
      attachedFiles.push({ name: f.name, content: text, truncated });
    }
    renderFileChips();
  }

  function buildMessage() {
    const q = input.value.trim();
    if (!attachedFiles.length) return q;
    const parts = [];
    parts.push(q || '请分析我上传的文件内容');
    parts.push('上传的文件如下：');
    for (const f of attachedFiles) {
      const lang = (f.name.split('.').pop() || '').toLowerCase();
      const note = f.truncated ? '\n// ...（文件过长，已截断）' : '';
      parts.push('【文件】' + f.name + '\n```' + lang + '\n' + f.content + note + '\n```');
    }
    return parts.join('\n\n');
  }

  function buildDisplay() {
    const q = input.value.trim();
    const fileLine = attachedFiles.length
      ? '📎 已附加文件：' + attachedFiles.map(f => f.name).join('、') : '';
    if (fileLine && q) return fileLine + '\n\n' + q;
    return fileLine || q;
  }

  // ---------------- 流式请求 ----------------
  async function sendMessage() {
    const msg = buildMessage();
    if (!msg) return;
    const display = buildDisplay();

    appendMsg('user', display);
    input.value = '';
    attachedFiles.length = 0;
    renderFileChips();
    autoResize();
    sendBtn.disabled = true;

    // 助手消息占位 + 输入中动画
    const bubble = appendMsg('assistant', '<span class="typing"><span>●</span><span>●</span><span>●</span></span>', { html: true });
    const tools = [];

    let raw = '';
    let errored = false;
    let started = false;

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg }),
      });

      if (!resp.ok) {
        let err = '请求失败 (' + resp.status + ')';
        try { const j = await resp.json(); if (j.error) err = j.error; } catch (e) {}
        throw new Error(err);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf('\n\n')) !== -1) {
          const frame = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          const event = parseFrame(frame);
          if (!event) continue;

          if (event.type === 'text') {
            if (!started) { started = true; }
            raw += event.text;
            bubble.textContent = raw; // 流式阶段用纯文本避免 markdown 半成品闪烁
          } else if (event.type === 'tool') {
            if (!tools.includes(event.name)) tools.push(event.name);
            const row = document.getElementById('tool-row') || addToolRow([]);
            row.id = 'tool-row';
            row.innerHTML = '';
            tools.forEach(t => {
              const chip = document.createElement('span');
              chip.className = 'tool-chip';
              chip.textContent = '🔧 ' + t;
              row.appendChild(chip);
            });
            scrollToBottom();
          } else if (event.type === 'error') {
            errored = true;
            raw = event.text;
            bubble.textContent = raw;
          }
        }
      }
    } catch (e) {
      errored = true;
      raw = e.message || String(e);
      bubble.textContent = raw;
    } finally {
      // 结束：用 markdown 重新渲染最终内容
      if (raw) {
        bubble.innerHTML = errored ? '<span>' + escapeHtml(raw) + '</span>' : renderMarkdown(raw);
        if (errored) bubble.classList.add('error');
      } else {
        bubble.textContent = '（Agent 未生成有效回复）';
      }
      sendBtn.disabled = false;
      input.focus();
      scrollToBottom();
    }
  }

  function parseFrame(frame) {
    let type = 'message', data = '';
    for (const line of frame.split('\n')) {
      if (line.startsWith('event:')) type = line.slice(6).trim();
      else if (line.startsWith('data:')) data += line.slice(5).trim();
    }
    if (!data) return null;
    let payload = {};
    try { payload = JSON.parse(data); } catch (e) { return null; }
    payload.type = type;
    return payload;
  }

  // ---------------- 事件绑定 ----------------
  input.addEventListener('input', autoResize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener('click', () => sendMessage());

  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => handleFiles(fileInput.files));

  clearBtn.addEventListener('click', async () => {
    try { await fetch('/api/clear', { method: 'POST' }); } catch (e) {}
    attachedFiles.length = 0;
    renderFileChips();
    addWelcome();
    input.focus();
  });

  // ---------------- 初始化 ----------------
  loadConfig();
  addWelcome();
})();
</script>
</body>
</html>
